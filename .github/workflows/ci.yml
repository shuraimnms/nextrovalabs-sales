name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test            # unit + integration (in-memory PGlite, no external DB)
      - run: npm run build
        env:
          APP_URL: http://localhost:3000
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: nsos }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nsos?sslmode=disable
      APP_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: ci-admin@example.test
      E2E_ADMIN_PASSWORD: Ci-Only-Passw0rd-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run bootstrap:admin
        env:
          BOOTSTRAP_EMAIL: ${{ env.E2E_ADMIN_EMAIL }}
          BOOTSTRAP_NAME: CI Admin
          BOOTSTRAP_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/, retention-days: 7 }
